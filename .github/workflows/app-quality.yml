name: App Quality

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/app-quality.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/app-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
