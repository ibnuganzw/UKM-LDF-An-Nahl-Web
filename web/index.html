    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
    <title>LDF An-Nahl — FKH USK</title>
    <script>
      // Apply the saved palette before CSS paints. New visitors start in the
      // light theme; an explicit saved dark preference still takes priority.
      (function () {
        var theme = 'light';
        try {
          var savedTheme = localStorage.getItem('annahl_theme');
          theme = savedTheme === 'dark' ? 'dark' : 'light';
        } catch (_) {
          // Storage can be unavailable in private browsing; light stays the default.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta && theme === 'dark') themeMeta.setAttribute('content', '#0A1128');
      })();
    </script>
    <script>
      // The hero photo is the LCP on the landing page; kick off its fetch
      // before the JS bundle is even parsed. Other routes never pay for it.
      if (location.pathname === '/') {
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.fetchPriority = 'high';
        heroPreload.href = matchMedia('(max-width: 640px)').matches
          ? '/assets/photos/hero-mushalla-mobile-v1.jpg'
          : '/assets/photos/hero-mushalla-desktop-v1.jpg';
        document.head.appendChild(heroPreload);
      }
    </script>
